name: Build PS5 TV Launcher APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi
          mkdir project
          unzip -q "$ZIP" -d project
          find project -maxdepth 3 -type f | head -100

      - name: Check Android project
        run: |
          if ! find project -name gradlew -type f | grep -q .; then
            echo "ERROR: Android Gradle project not found"
            exit 1
          fi

      - name: Build APK
        working-directory: project
        run: |
          chmod +x "$(find . -name gradlew -type f | head -n 1)"
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PS5-TV-Launcher-APK
          path: project/**/build/outputs/apk/debug/*.apk
          
