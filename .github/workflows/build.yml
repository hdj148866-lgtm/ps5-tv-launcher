name: Build PS5 TV Launcher APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          unzip -q Launcherx-main.zip -d extracted_project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Generate Gradle Wrapper
        run: |
          BUILD_FILE=$(find extracted_project -name "build.gradle" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            DIR=$(dirname "$BUILD_FILE")
            echo "Found build config in $DIR, generating gradlew..."
            cd "$DIR"
            gradle wrapper --gradle-version 8.0
            cd -
          else
            echo "No build.gradle found!"
          fi

      - name: Build APK
        run: |
          GRADLEW_PATH=$(find extracted_project -name gradlew | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            chmod +x "$GRADLEW_PATH"
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cd "$PROJECT_DIR"
            ./gradlew assembleDebug --stacktrace
          else
            echo "ERROR: gradlew could not be generated."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: /**/build/outputs/apk/debug/*.apk
