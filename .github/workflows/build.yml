name: Build PS5 TV Launcher APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          unzip -q Launcherx-main.zip -d extracted_project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: |
          GRADLEW_PATH=$(find extracted_project -name gradlew | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            chmod +x "$GRADLEW_PATH"
          else
            echo "Gradlew not found inside ZIP!"
            exit 1
          fi

      - name: Build APK
        run: |
          GRADLEW_PATH=$(find extracted_project -name gradlew | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifacts@v4
        with:
          name: app-debug.apk
          path: /**/build/outputs/apk/debug/*.apk
